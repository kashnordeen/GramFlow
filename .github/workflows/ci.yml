name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gramflow_test
          POSTGRES_USER: gramflow
          POSTGRES_PASSWORD: gramflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gramflow -d gramflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gramflow:gramflow@localhost:5432/gramflow_test
      TEST_DATABASE_URL: postgresql://gramflow:gramflow@localhost:5432/gramflow_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      REGISTRATION_CODE: ci-registration-code
      ALLOWED_EMAIL_DOMAIN: hemp.com
      COST_PRICE_PER_GRAM: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
