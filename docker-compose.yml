services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gramflow
      POSTGRES_USER: gramflow
      POSTGRES_PASSWORD: gramflow
    ports:
      - "5432:5432"
    volumes:
      - gramflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gramflow -d gramflow"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gramflow_postgres:
