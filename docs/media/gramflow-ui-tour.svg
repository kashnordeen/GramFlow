<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Animated tour of the GramFlow operations dashboard</title>
  <desc id="desc">A dark inventory dashboard with navigation, inventory pulse, sales trend, stock health, and an action queue. Highlights move between the major areas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07100d"/><stop offset="1" stop-color="#0c1511"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8ff3e"/><stop offset="1" stop-color="#91d817"/></linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9f52a" stop-opacity=".28"/><stop offset="1" stop-color="#b9f52a" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".32"/></filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #82918a; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; }
      .muted { fill: #82918a; } .card { fill: #111b17; stroke: #27352f; stroke-width: 1; } .grid { stroke: #1c2a24; stroke-width: 1; }
      .pulse { animation: pulse 7.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .step-one { animation-delay: 0s; } .step-two { animation-delay: 2.5s; } .step-three { animation-delay: 5s; }
      .cursor { animation: cursor-tour 7.5s ease-in-out infinite; } .dot { animation: blink 1.5s ease-in-out infinite; }
      .chart-line { stroke-dasharray: 540; stroke-dashoffset: 540; animation: draw 7.5s ease-in-out infinite; }
      @keyframes pulse { 0%, 26%, 100% { opacity: .18; transform: scale(.985); } 7%, 20% { opacity: 1; transform: scale(1); } }
      @keyframes cursor-tour { 0%, 25% { transform: translate(0, 0); } 34%, 58% { transform: translate(510px, 184px); } 67%, 92% { transform: translate(820px, 382px); } 100% { transform: translate(0, 0); } }
      @keyframes blink { 50% { opacity: .35; } }
      @keyframes draw { 0%, 5% { stroke-dashoffset: 540; } 24%, 76% { stroke-dashoffset: 0; } 92%, 100% { stroke-dashoffset: -540; } }
      @media (prefers-reduced-motion: reduce) { .pulse, .cursor, .dot, .chart-line { animation: none !important; } .pulse { opacity: .35; } .chart-line { stroke-dashoffset: 0; } }
    </style>
  </defs>
  <rect width="1440" height="810" rx="26" fill="url(#bg)"/>
  <path d="M0 54h1440M0 108h1440M0 162h1440M0 216h1440M0 270h1440M0 324h1440M0 378h1440M0 432h1440M0 486h1440M0 540h1440M0 594h1440M0 648h1440M0 702h1440M0 756h1440" class="grid" opacity=".22"/>
  <path d="M54 0v810M108 0v810M162 0v810M216 0v810M270 0v810M324 0v810M378 0v810M432 0v810M486 0v810M540 0v810M594 0v810M648 0v810M702 0v810M756 0v810M810 0v810M864 0v810M918 0v810M972 0v810M1026 0v810M1080 0v810M1134 0v810M1188 0v810M1242 0v810M1296 0v810M1350 0v810M1404 0v810" class="grid" opacity=".16"/>
  <g filter="url(#shadow)"><rect x="34" y="32" width="1372" height="746" rx="22" fill="#0b1310" stroke="#2b3933"/><rect x="34" y="32" width="246" height="746" rx="22" fill="#0d1612"/><path d="M280 32v746" stroke="#28362f"/></g>
  <g aria-label="Sidebar">
    <rect x="60" y="58" width="38" height="38" rx="11" fill="url(#lime)"/><text x="72" y="84" fill="#0b130f" font-size="20" font-weight="900">G</text><text x="111" y="83" fill="#f3f7f5" font-size="18" font-weight="800">GramFlow</text>
    <text x="60" y="140" class="label">OPERATE</text><rect x="50" y="157" width="210" height="42" rx="11" fill="#1a281f"/><circle cx="73" cy="178" r="7" fill="#b9f52a"/><text x="92" y="184" fill="#f4f7f5" font-size="14" font-weight="700">Dashboard</text>
    <g fill="#8e9d96" font-size="14" font-weight="600"><text x="60" y="228">＋  Record sale</text><text x="60" y="270">↔  Transactions</text><text x="60" y="312">◉  Customers</text><text x="60" y="354">▦  Stock vault</text></g>
    <text x="60" y="416" class="label">CONTROL</text><g fill="#8e9d96" font-size="14" font-weight="600"><text x="60" y="452">▤  Accounting</text><text x="60" y="494">◎  Audit log</text></g>
    <text x="60" y="556" class="label">SYSTEM</text><g fill="#8e9d96" font-size="14" font-weight="600"><text x="60" y="592">⚙  Settings</text><text x="60" y="634">♙  Access control</text></g>
    <rect x="51" y="691" width="211" height="67" rx="13" fill="#111d18" stroke="#26372e"/><circle cx="74" cy="714" r="5" fill="#a9ed28" class="dot"/><text x="87" y="718" fill="#d8e1dd" font-size="12" font-weight="700">FIFO engine active</text><text x="66" y="740" class="muted" font-size="10">Lineage and audit controls online</text>
  </g>
  <g aria-label="Top navigation">
    <text x="315" y="75" fill="#f4f7f5" font-size="18" font-weight="800">Dashboard</text><text x="315" y="98" class="muted" font-size="11">LIVE WORKSPACE · 26 SEPT</text>
    <rect x="970" y="56" width="176" height="42" rx="12" fill="#111b17" stroke="#2a3832"/><text x="990" y="82" fill="#9aa8a1" font-size="12">Search destinations</text>
    <rect x="1159" y="56" width="42" height="42" rx="12" fill="#111b17" stroke="#2a3832"/><text x="1174" y="83" fill="#cbd5d1" font-size="17">☼</text>
    <rect x="1214" y="56" width="112" height="42" rx="12" fill="url(#lime)"/><text x="1238" y="82" fill="#142008" font-size="12" font-weight="800">Record sale</text><circle cx="1359" cy="77" r="21" fill="#1c2a24" stroke="#33453c"/><text x="1353" y="83" fill="#d9e1dd" font-size="15" font-weight="800">A</text>
  </g>
  <g aria-label="Dashboard content">
    <text x="315" y="155" class="label" fill="#b9f52a">BUSINESS COMMAND CENTER</text><text x="315" y="198" fill="#f6f8f7" font-size="34" font-weight="820">Good morning, Admin</text><text x="315" y="225" class="muted" font-size="14">Live inventory, margin, customer balances, and the next decisions that need attention.</text>
    <g class="pulse step-one"><rect x="303" y="260" width="346" height="174" rx="18" fill="none" stroke="#b9f52a" stroke-width="3" filter="url(#glow)"/></g>
    <rect x="315" y="272" width="322" height="150" rx="16" class="card"/><text x="339" y="304" class="label">INVENTORY PULSE</text><rect x="510" y="287" width="96" height="25" rx="12" fill="#17331f"/><text x="532" y="304" fill="#9de43a" font-size="11" font-weight="800">HEALTHY</text><text x="339" y="360" fill="#f4f7f5" font-size="48" font-weight="850">10</text><text x="403" y="360" fill="#a5b1ab" font-size="18">g</text><text x="339" y="390" class="muted" font-size="12">Inventory is ready for the next transaction.</text>
    <rect x="659" y="272" width="350" height="150" rx="16" class="card"/><text x="683" y="304" class="label">SALES TODAY</text><text x="683" y="359" fill="#f4f7f5" font-size="42" font-weight="850">₹24,680</text><text x="683" y="389" fill="#9de43a" font-size="12" font-weight="700">↗ 12.4% vs yesterday</text>
    <rect x="1021" y="272" width="350" height="150" rx="16" class="card"/><text x="1045" y="304" class="label">7 DAY GROSS PROFIT</text><text x="1045" y="359" fill="#f4f7f5" font-size="42" font-weight="850">₹9,420</text><text x="1045" y="389" class="muted" font-size="12">38.2% realized margin</text>
    <g class="pulse step-two"><rect x="303" y="448" width="706" height="294" rx="18" fill="none" stroke="#b9f52a" stroke-width="3" filter="url(#glow)"/></g>
    <rect x="315" y="460" width="682" height="270" rx="16" class="card"/><text x="339" y="491" class="label">PERFORMANCE SIGNAL</text><text x="339" y="526" fill="#f4f7f5" font-size="20" font-weight="780">Sales and gross profit</text>
    <g opacity=".55" stroke="#2b3933"><path d="M348 570h616M348 610h616M348 650h616M348 690h616"/></g><path d="M348 681 C392 666 428 674 468 634 S548 599 592 621 S675 642 715 588 S799 538 840 562 S917 588 964 514 L964 700 L348 700Z" fill="url(#chart)"/><path d="M348 681 C392 666 428 674 468 634 S548 599 592 621 S675 642 715 588 S799 538 840 562 S917 588 964 514" fill="none" stroke="#b9f52a" stroke-width="4" stroke-linecap="round" class="chart-line"/><path d="M348 693 C405 684 441 687 484 672 S571 661 612 674 S691 666 735 638 S815 632 856 641 S923 630 964 616" fill="none" stroke="#62a7ff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
    <rect x="1021" y="460" width="350" height="270" rx="16" class="card"/><text x="1045" y="491" class="label">PRIORITIZED WORK</text><text x="1045" y="526" fill="#f4f7f5" font-size="20" font-weight="780">Action queue</text>
    <g class="pulse step-three"><rect x="1032" y="544" width="328" height="82" rx="14" fill="none" stroke="#b9f52a" stroke-width="3" filter="url(#glow)"/></g>
    <rect x="1045" y="556" width="302" height="58" rx="12" fill="#17231e" stroke="#2c3b34"/><circle cx="1069" cy="585" r="10" fill="#2d4d27"/><text x="1090" y="582" fill="#e3e9e6" font-size="12" font-weight="750">Two balances need attention</text><text x="1090" y="600" class="muted" font-size="10">Review customer receivables</text>
    <rect x="1045" y="630" width="302" height="58" rx="12" fill="#111c17" stroke="#27372f"/><circle cx="1069" cy="659" r="10" fill="#41391e"/><text x="1090" y="656" fill="#e3e9e6" font-size="12" font-weight="750">Oldest batch is 18 days old</text><text x="1090" y="674" class="muted" font-size="10">Open Stock vault</text>
  </g>
  <g class="cursor" aria-hidden="true"><path d="M404 330l24 58 9-19 18 17 8-8-18-17 20-8z" fill="#f7faf8" stroke="#0b120f" stroke-width="3"/><circle cx="430" cy="359" r="19" fill="none" stroke="#b9f52a" stroke-width="3" opacity=".55"/></g>
  <rect x="34" y="32" width="1372" height="746" rx="22" fill="none" stroke="#3b4d44" stroke-opacity=".45"/>
</svg>
